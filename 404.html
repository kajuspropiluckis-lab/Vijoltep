<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puslapis nerastas — Reta grandis</title>
<meta name="description" content="Šis puslapis neegzistuoja arba buvo perkeltas.">
<meta name="theme-color" content="#1c1712">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1712'/%3E%3Cpath d='M12 20a5 5 0 0 1 0-8h3a1 1 0 0 1 0 2h-3a3 3 0 0 0 0 6h3a1 1 0 0 1 0 2h-3Z' fill='%23a2453f'/%3E%3Cpath d='M20 12a5 5 0 0 1 0 8h-3a1 1 0 0 1 0-2h3a3 3 0 0 0 0-6h-3a1 1 0 0 1 0-2h3Z' fill='%23a2453f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1712; --bg-raised: #241e17; --ink: #ede6d8; --ink-muted: #a79c8a;
    --line: #3a322a; --accent: #a2453f; --accent-ink: #f3e2df;
    --serif: 'Lora', serif; --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;
  }
  .mark{font-family:var(--serif);font-size:16px;letter-spacing:.05em;color:var(--ink-muted);margin-bottom:24px;}
  .code{font-family:var(--serif);font-size:15px;color:var(--ink-muted);margin:0 0 10px;letter-spacing:.05em;}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0 auto 16px;max-width:20ch;}
  p{font-size:15px;color:var(--ink-muted);max-width:40ch;margin:0 auto 30px;}
  .cta{
    display:inline-block;background:none;color:var(--accent-ink);
    border:1px solid var(--accent);padding:12px 24px;font-size:15px;
    font-family:var(--sans);font-weight:500;cursor:pointer;text-decoration:none;
    border-radius:2px;transition:background .15s ease;
  }
  .cta:hover, .cta:focus-visible{background:var(--accent);}
</style>
</head>
<body>
  <div>
    <div class="mark">Reta grandis</div>
    <p class="code">404</p>
    <h1>Šis puslapis neegzistuoja</h1>
    <p>Nuoroda galėjo pasikeisti arba puslapis buvo perkeltas.</p>
    <a href="index.html" class="cta">Grįžti į pradžią</a>
  </div>
</body>
</html>
